require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require compulab-imx9.inc

IMAGE_INSTALL:append = " firmware-nxp-wifi-nxpiw612-sdio "
IMAGE_INSTALL:append = " wwan-config "
IMAGE_INSTALL:append = " wlan-config "
IMAGE_INSTALL:append = " can-config "
IMAGE_INSTALL:append = " evtest "
IMAGE_INSTALL:append = " tpm2-tools libtss2-tcti-device "

MACHINE_FEATURES += "wifi bluetooth"
MACHINE_FEATURES:append:use-nxp-bsp = " optee jailhouse "
MACHINE_FEATURES:append = "nxpiw612-sdio"

KERNEL_CLASSES += "kernel-fitimage"
KERNEL_IMAGETYPES:append = " fitImage "

# components to include
KERNEL_DEVICETREE_BASENAME = "iot-link"
DTB="${KERNEL_DEVICETREE_BASENAME}.dtb"
KERNEL_DEVICETREE = " \
    compulab/${DTB} \
    compulab/iot-link-fars485.dtbo \
    compulab/iot-link-fbrs485.dtbo \
    compulab/iot-link-facan.dtbo \
    compulab/iot-link-fbcan.dtbo \
"
UBOOT_DTB_NAME:iot-link = "${DTB}"
FIT_CONF_DEFAULT_DTB = "${DTB}"
FIT_DESC ?= "fitImage for C-Lab ${MACHINE} BSP Release ${CL_RELEASE}, Kernel ${PV}"

# Required RAM addresses for ARM64 FIT Image assembly
UBOOT_ENTRYPOINT      = "0x80480000"
UBOOT_LOADADDRESS     = "0x80480000"
# Push the FIT image internal FDT destination away from the kernel
UBOOT_DTB_LOADADDRESS = "0x93000000"
UBOOT_DTBO_LOADADDRESS = "0x93100000"

FIT_GENERATE_KEYS = "1"

IMX_DEFAULT_BOOTLOADER:use-nxp-bsp = "u-boot-compulab"
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp = "u-boot-compulab"

LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = ""

SPL_BINARY = "spl/u-boot-spl.bin"

UBOOT_CONFIG_BASENAME = "iot-link"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd]   = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"
UBOOT_CONFIG[ecc]  = "${UBOOT_CONFIG_BASENAME}_inline_ecc_defconfig"
UBOOT_CONFIG[ld]   = "${UBOOT_CONFIG_BASENAME}_ld_defconfig"

# Set ATF platform name
ATF_PLATFORM = "imx93"

IMXBOOT_TARGETS = "flash_singleboot"

IMX_BOOT_SOC_TARGET = "iMX9"
IMX_BOOT_SEEK = "32"

# We have to disable SERIAL_CONSOLE due to auto-serial-console
SERIAL_CONSOLES = "115200;ttyLP0"

# Add additional firmware
MACHINE_FIRMWARE:append = " ethos-u-firmware linux-firmware-sd8997 "

DDR_FIRMWARE_NAME = " \
        lpddr4_dmem_1d_v202201.bin \
        lpddr4_dmem_2d_v202201.bin \
        lpddr4_imem_1d_v202201.bin \
        lpddr4_imem_2d_v202201.bin \
"

IMAGE_BOOT_FILES:append:use-nxp-bsp = " \
        imx93_m33_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
        imx93_m33_TCM_rpmsg_lite_str_echo_rtos.bin \
"
WKS_FILE_DEPENDS:append = " imx-m33-demos"

CL_RELEASE = "1.0"
