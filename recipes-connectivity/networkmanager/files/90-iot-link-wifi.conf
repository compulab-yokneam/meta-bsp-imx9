# NXP firmware rejects MAC changes during scanning.
[device-iot-link-wlan]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

# Client networking uses wlan0; avoid concurrent scans on auxiliary interfaces.
[device-iot-link-aux]
match-device=interface-name:uap0;interface-name:wfd0
managed=0

[connection-iot-link-wlan]
match-device=interface-name:wlan0
wifi.cloned-mac-address=permanent
